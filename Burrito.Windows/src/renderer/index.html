<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burrito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- DROPZONE VIEW -->
        <div id="dropzone-view" class="view active">
            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <img class="burrito-icon" src="../../assets/icon.png" alt="Burrito">
                    <span class="title">Burrito</span>
                </div>
                <div class="header-right">
                    <button id="pin-btn" class="icon-btn" title="Pin Window (Stay Open)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="pin-icon">
                            <path d="M16 12V4H8v8l-2 2v2h5v6l1 1 1-1v-6h5v-2l-2-2z" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button id="settings-btn" class="icon-btn" title="Settings">
                        <svg viewBox="0 0 24 24" fill="currentColor" class="gear-icon">
                            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-container">
                <!-- Split Zones -->
                <div id="split-zones" class="split-zones">
                    <div id="zone-png" class="drop-zone">
                        <span id="label-png" class="zone-label">PNG</span>
                    </div>
                    <div class="divider"></div>
                    <div id="zone-webp" class="drop-zone">
                        <span id="label-webp" class="zone-label">WEBP</span>
                    </div>
                </div>

                <!-- Processing Overlay -->
                <div id="processing-overlay" class="processing-overlay hidden">
                    <canvas id="fluid-canvas"></canvas>

                    <div id="processing-content" class="overlay-content">
                        <div id="fanned-stack" class="fanned-stack"></div>

                        <div id="status-container" class="status-container">
                            <div id="status-processing" class="status-block">
                                <span class="status-label">PROCESSING</span>
                            </div>

                            <div id="status-success" class="status-block hidden">
                                <svg class="status-icon success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke-linecap="round" stroke-linejoin="round"/>
                                    <polyline points="22 4 12 14.01 9 11.01" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <div class="status-text-row">
                                    <span class="status-label">SUCCESS</span>
                                    <span id="savings-pill" class="savings-pill">-0%</span>
                                </div>
                            </div>

                            <div id="status-error" class="status-block hidden">
                                <svg class="status-icon error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke-linecap="round" stroke-linejoin="round"/>
                                    <line x1="12" y1="9" x2="12" y2="13" stroke-linecap="round" stroke-linejoin="round"/>
                                    <line x1="12" y1="17" x2="12.01" y2="17" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span id="error-message" class="status-label error-label">ERROR</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="settings-view" class="view hidden">
            <!-- Settings Header -->
            <div class="header">
                <button id="back-btn" class="back-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="chevron-icon">
                        <polyline points="15 18 9 12 15 6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Back</span>
                </button>
                <span class="title">Quality Settings</span>
                <div style="width: 50px;"></div>
            </div>

            <!-- Sliders Container -->
            <div class="settings-content">
                <div class="slider-group">
                    <div class="slider-header">
                        <span>Image Quality</span>
                        <span id="image-quality-val">80</span>
                    </div>
                    <input type="range" id="image-quality-slider" min="40" max="100" value="80" step="1">
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <span>Video Quality</span>
                        <span id="video-quality-val">80</span>
                    </div>
                    <input type="range" id="video-quality-slider" min="40" max="100" value="80" step="1">
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
